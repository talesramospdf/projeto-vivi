name = "projeto-vivi"
main = "src/worker.js"
compatibility_date = "2025-01-01"
workers_dev = true    # mantém o link projeto-vivi.<conta>.workers.dev ligado
keep_vars = true      # não apaga variáveis cadastradas no painel a cada deploy

# Arquivos do site (HTML, JS, CSS)
[assets]
directory = "./public"
binding = "ASSETS"

# Bucket R2 com os PDFs dos capítulos e o capitulos.json
[[r2_buckets]]
binding = "LIVRO"
bucket_name = "livro-vivi"

# GEMINI_API_KEY e SENHA são "Secrets" configurados no painel do Cloudflare.

# Tradução em segundo plano: processa a fila a cada minuto (grátis)
[triggers]
crons = ["* * * * *"]
