name = "projeto-vivi"
main = "src/worker.js"
compatibility_date = "2025-01-01"
workers_dev = true    # mantém o link projeto-vivi.<conta>.workers.dev ligado

# Arquivos do site (HTML, JS, CSS)
[assets]
directory = "./public"
binding = "ASSETS"

# Bucket R2 com os PDFs dos capítulos e o capitulos.json
[[r2_buckets]]
binding = "LIVRO"
bucket_name = "livro-vivi"

# GEMINI_API_KEY e SENHA são "Secrets" configurados no painel do Cloudflare.
